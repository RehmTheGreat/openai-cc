name: PR 44 repair helper

on:
  pull_request:
    types: [synchronize]
    paths:
      - ".ci/pr44-syntax-trigger"

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.number == 44 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Repair installer syntax and add regression guard
        shell: python
        run: |
          from pathlib import Path
          install = Path("install.ps1")
          text = install.read_text()
          bad = "if (-not (Has-UsableChatGptCredential()) {"
          good = "if (-not (Has-UsableChatGptCredential)) {"
          if bad in text:
              text = text.replace(bad, good, 1)
          if good not in text:
              raise SystemExit("Expected corrected Codex credential guard is missing")
          install.write_text(text)

          test = Path("tests/install-bootstrap.test.ts")
          text = test.read_text()
          marker = "  assert.match(install, /No usable ChatGPT OAuth credential is present/);\n"
          guard = "  assert.match(install, /if \\(-not \\(Has-UsableChatGptCredential\\)\\) \\{/);\n  assert.doesNotMatch(install, /Has-UsableChatGptCredential\\(\\)/);\n"
          if guard not in text:
              if marker not in text:
                  raise SystemExit("Regression-test insertion marker is missing")
              text = text.replace(marker, guard + marker, 1)
          test.write_text(text)

      - name: Verify full test suite
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Commit repaired files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install.ps1 tests/install-bootstrap.test.ts
          git diff --cached --check
          git commit -m "Fix installer PowerShell syntax and guard it"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
