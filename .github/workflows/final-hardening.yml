name: Apply Final Auth Hardening

on:
  push:
    branches:
      - agent/auth-admin-control-plane
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    # This workflow is intentionally one-shot and deletes itself in its result commit.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/auth-admin-control-plane
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic hardening transformation
        run: python scripts/final-hardening.py
      - name: Verify transformed source before commit
        run: npm ci --no-audit --no-fund && npm test
      - name: Remove one-shot helper and commit result
        shell: bash
        run: |
          rm -f scripts/final-hardening.py .github/workflows/final-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden authentication error lifecycle"
          git push origin HEAD:agent/auth-admin-control-plane
