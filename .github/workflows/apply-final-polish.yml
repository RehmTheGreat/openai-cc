name: Apply Final Control Plane Polish

on:
  push:
    branches:
      - agent/auth-admin-final-polish

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/auth-admin-final-polish
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic source transformation
        run: python scripts/apply-final-polish.py
      - name: Verify transformed source
        run: npm ci --no-audit --no-fund && npm test
      - name: Remove one-shot files and commit verified result
        shell: bash
        run: |
          rm -f scripts/apply-final-polish.py .github/workflows/apply-final-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete device auth and remote admin behavior"
          git push origin HEAD:agent/auth-admin-final-polish
