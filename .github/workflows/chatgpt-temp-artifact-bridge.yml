name: ChatGPT Temporary Artifact Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-temp-artifact-bridge.yml'

permissions:
  contents: write

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify merged n8n skill
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 'https://litter.catbox.moe/8d46vo.md' -o N8N_OFFICIAL_MEGA_SKILL.md
          echo 'e912ec138803032778fbf9a789ae1a12b68b1b55287c17c9211f6bf90af8a166  N8N_OFFICIAL_MEGA_SKILL.md' | sha256sum -c -
          test "$(wc -c < N8N_OFFICIAL_MEGA_SKILL.md)" -eq 648548

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: n8n-official-mega-skill
          path: N8N_OFFICIAL_MEGA_SKILL.md
          if-no-files-found: error
          retention-days: 1

      - name: Remove temporary transfer branch
        shell: bash
        run: git push origin --delete chatgpt-temp-transfer-20260822 || true

      - name: Remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/chatgpt-temp-artifact-bridge.yml
          git commit -m 'Remove temporary artifact bridge'
          git push origin HEAD:main
