name: One-shot installer test patch
on:
  push:
    branches: [fix/per-route-context-and-compaction]
    paths: [".github/PATCH_INSTALLER_TEST"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/per-route-context-and-compaction
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/install-bootstrap.test.ts'); s=p.read_text()
          old='  assert.match(install, /configuredAlias -ne \\[string\\]\\$model\\.id/);'
          new='  assert.match(install, /aliasModel\\.display_name -ne \\$title/);\n  assert.match(install, /v1\\/models\\/\\$encodedAlias/);'
          if s.count(old)!=1: raise SystemExit(f'expected one stale assertion, found {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          git rm .github/workflows/patch-installer-test.yml .github/PATCH_INSTALLER_TEST
          git diff --check
          git config user.name "OpenAI-CC CI patch"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Align installer verification regression test"
          git push origin HEAD:fix/per-route-context-and-compaction
