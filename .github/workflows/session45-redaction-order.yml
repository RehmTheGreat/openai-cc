name: Apply Session 4.5 redaction ordering fix
on:
  push:
    branches: [agent/session-4-5-final-providers]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[session45-redaction-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/session45-redaction-order.mjs
      - shell: bash
        run: |
          git config user.name "openai-cc-session45"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix Session 4.5 redaction ordering [session45-redaction-applied]"
          git push origin HEAD:${GITHUB_REF_NAME}
