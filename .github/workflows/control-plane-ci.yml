name: Auth Admin Control Plane CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The same locked suite must pass on both the primary Windows target and Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify bundled official Codex CLI
        shell: bash
        if: runner.os != 'Windows'
        run: |
          node node_modules/@openai/codex/bin/codex.js --version
          node node_modules/@openai/codex/bin/codex.js login --help
      - name: Verify bundled official Codex CLI on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node node_modules/@openai/codex/bin/codex.js --version
          node node_modules/@openai/codex/bin/codex.js login --help
      - name: Run full test suite
        run: npm test
      - name: Configure fresh Claude Code gateway context
        env:
          OPENAI_CC_CONFIGURE_CLAUDE_DESKTOP: "0"
          OPENAI_CC_CONTEXT_WINDOW: "850000"
          ANTHROPIC_BASE_URL: "http://127.0.0.1:9"
          DATA_DIR: ${{ runner.temp }}/openai-cc-context
        run: node dist/scripts/configure-clients.js
      - name: Verify Claude Code client context budget
        run: node scripts/verify-claude-code-context.mjs
      - name: Parse Windows installers
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          [void][scriptblock]::Create((Get-Content setup.ps1 -Raw))
          [void][scriptblock]::Create((Get-Content install.ps1 -Raw))
