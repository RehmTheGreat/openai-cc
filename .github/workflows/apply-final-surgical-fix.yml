name: Apply final surgical fixes

on:
  push:
    branches:
      - fix/custom-provider-luna-context-v2

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/custom-provider-luna-context-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply surgical patch
        run: python scripts/apply-final-surgical-fix.py
      - name: Commit final branch
        run: |
          git config user.name "openai-cc-maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finish Luna custom-provider context fixes"
          git push origin HEAD:fix/custom-provider-luna-context-v2
