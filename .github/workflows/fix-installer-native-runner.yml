name: Apply installer native runner fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-installer-native-runner.yml"

permissions:
  contents: write

jobs:
  fix-installer:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Patch installer and regression test
        shell: pwsh
        run: |
          $setupPath = "setup.ps1"
          $setup = Get-Content $setupPath -Raw
          $oldRunner = @'
          function Invoke-NativeConsole([string]$Command, [string[]]$Arguments) {
            # Do not redirect native stderr in Windows PowerShell 5.1. Redirecting 2>&1
            # converts ordinary native stderr progress into ErrorRecords. With the
            # installer's global Stop preference that can abort on harmless Git output.
            & $Command @Arguments
            return [int]$LASTEXITCODE
          }
          '@
          $newRunner = @'
          function Invoke-NativeConsole([string]$Command, [string[]]$Arguments) {
            # Do not redirect native stderr in Windows PowerShell 5.1. Redirecting 2>&1
            # converts ordinary native stderr progress into ErrorRecords. With the
            # installer's global Stop preference that can abort on harmless Git output.
            # Send stdout to the host so it stays visible without becoming function output.
            & $Command @Arguments | Out-Host
            $nativeExitCode = $LASTEXITCODE
            return [int]$nativeExitCode
          }
          '@
          if (-not $setup.Contains($oldRunner)) { throw "Expected Invoke-NativeConsole block was not found." }
          $setup = $setup.Replace($oldRunner, $newRunner)
          [IO.File]::WriteAllText((Resolve-Path $setupPath), $setup, [Text.UTF8Encoding]::new($false))

          $testPath = "tests/claude-desktop.test.ts"
          $tests = Get-Content $testPath -Raw
          $oldAssertions = @'
            assert.match(setup, /& \$Command @Arguments/);
            assert.doesNotMatch(setup, /& \$Command @Arguments 2>&1/);
          '@
          $newAssertions = @'
            assert.match(setup, /& \$Command @Arguments \| Out-Host/);
            assert.match(setup, /\$nativeExitCode = \$LASTEXITCODE/);
            assert.match(setup, /return \[int\]\$nativeExitCode/);
            assert.doesNotMatch(setup, /& \$Command @Arguments 2>&1/);
          '@
          if (-not $tests.Contains($oldAssertions)) { throw "Expected native-runner test assertions were not found." }
          $tests = $tests.Replace($oldAssertions, $newAssertions)
          [IO.File]::WriteAllText((Resolve-Path $testPath), $tests, [Text.UTF8Encoding]::new($false))

      - name: Verify Windows PowerShell output isolation
        shell: powershell
        run: |
          $setup = Get-Content setup.ps1 -Raw
          $match = [regex]::Match($setup, '(?ms)^function Invoke-NativeConsole\([^\r\n]+\) \{.*?^\}')
          if (-not $match.Success) { throw "Could not extract Invoke-NativeConsole from setup.ps1." }
          Invoke-Expression $match.Value
          $result = Invoke-NativeConsole (Get-Command cmd.exe).Source @('/c', 'echo native-output')
          if ($result -is [array]) { throw "Invoke-NativeConsole leaked native stdout into its return value." }
          if ([int]$result -ne 0) { throw "Expected native exit code 0, got $result." }

      - name: Run project tests
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Commit the fix and remove this one-shot workflow
        shell: pwsh
        run: |
          Remove-Item ".github/workflows/fix-installer-native-runner.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add setup.ps1 tests/claude-desktop.test.ts .github/workflows/fix-installer-native-runner.yml
          git commit -m "Fix PowerShell native runner exit code"
          git push origin HEAD:main
