name: Agent Apply Patch

on:
  push:
    branches:
      - fix/macos-frictionless-installer
    paths:
      - agent-patch.diff

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/macos-frictionless-installer
          fetch-depth: 0
      - name: Apply reviewed patch and clean bridge
        run: |
          set -euo pipefail
          git apply --index agent-patch.diff
          git rm agent-patch.diff .github/workflows/agent-apply-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: make macOS installer frictionless"
          git push origin HEAD:fix/macos-frictionless-installer
