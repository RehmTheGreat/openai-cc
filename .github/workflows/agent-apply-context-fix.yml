name: Apply agent context fix

on:
  push:
    branches: [agent/claude-850k-context]
    paths:
      - scripts/apply-agent-context-fix.mjs
      - scripts/apply-agent-context-fix-phase2.mjs
      - .github/workflows/agent-apply-context-fix.yml
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.head_ref == 'agent/claude-850k-context'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/claude-850k-context
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize legacy test label
        run: sed -i 's/shared Claude settings use safe aliases, 700k/shared Claude settings use safe aliases, 850k/' tests/claude-desktop.test.ts
      - name: Apply scoped context fix
        run: node scripts/apply-agent-context-fix.mjs
      - name: Preserve semantic route ids and route-specific limits
        run: node scripts/apply-agent-context-fix-phase2.mjs
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run regression suite
        run: npm test
      - name: Inspect generated diff
        run: |
          git diff --check
          git status --short
          git diff --stat
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "openai-agent"
          git config user.email "openai-agent@users.noreply.github.com"
          git add -A
          git commit -m "Fix Claude Code extended gateway context"
          git push origin HEAD:agent/claude-850k-context
