name: Publish Gated Runtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-windows-runtime:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      B2_PUBLISH_KEY_ID: ${{ secrets.B2_PUBLISH_KEY_ID }}
      B2_PUBLISH_KEY: ${{ secrets.B2_PUBLISH_KEY }}
      B2_BUCKET_ID: ${{ vars.B2_BUCKET_ID }}
    steps:
      - name: Require hard-free distribution configuration
        shell: powershell
        run: |
          if (-not $env:B2_PUBLISH_KEY_ID) { throw "Missing repository secret B2_PUBLISH_KEY_ID" }
          if (-not $env:B2_PUBLISH_KEY) { throw "Missing repository secret B2_PUBLISH_KEY" }
          if (-not $env:B2_BUCKET_ID) { throw "Missing repository variable B2_BUCKET_ID" }

      - name: Checkout exact selected source commit
        uses: actions/checkout@v4

      - name: Verify publisher credential against live Backblaze
        shell: powershell
        run: .\distribution\b2\verify-publisher.ps1 -FromEnvironment

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Test exact build identity
        shell: pwsh
        run: |
          $env:OPENAI_CC_SOURCE_SHA = (git rev-parse HEAD).Trim()
          $env:OPENAI_CC_BUILD_TIME = (git show -s --format=%cI HEAD).Trim()
          npm test
          if ($LASTEXITCODE -ne 0) { throw "npm test failed" }
          $build = Get-Content dist/build-info.json -Raw | ConvertFrom-Json
          if ($build.buildSha -ne $env:OPENAI_CC_SOURCE_SHA) { throw "Build SHA mismatch before packaging" }

      - name: Prune development dependencies
        run: npm prune --omit=dev --no-audit --no-fund

      - name: Build deterministic runtime bundle
        shell: powershell
        run: |
          $out = Join-Path $env:RUNNER_TEMP "openai-cc-b2-publish"
          .\scripts\build-runtime-bundle.ps1 -OutputDirectory $out
          $manifest = Get-Content (Join-Path $out "openai-cc-runtime-manifest.json") -Raw | ConvertFrom-Json
          if (-not (Test-Path (Join-Path $out ([string]$manifest.bundleUrl)))) { throw "Bundle referenced by manifest is missing" }
          "PUBLISH_DIR=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify no persistent user state is distributable
        shell: powershell
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $manifest = Get-Content (Join-Path $env:PUBLISH_DIR "openai-cc-runtime-manifest.json") -Raw | ConvertFrom-Json
          $zip = [IO.Compression.ZipFile]::OpenRead((Join-Path $env:PUBLISH_DIR ([string]$manifest.bundleUrl)))
          try {
            foreach ($entry in $zip.Entries) {
              $name = $entry.FullName.Replace('\\','/').ToLowerInvariant()
              foreach ($needle in @(".data/", "accounts.json", "providers.json", "model-config.json", "auth.json", ".env", ".git/")) {
                if ($name -eq $needle -or $name.StartsWith($needle) -or $name.EndsWith("/$needle")) {
                  throw "Forbidden persistent/provider state in distributable runtime: $($entry.FullName)"
                }
              }
            }
          } finally { $zip.Dispose() }

      - name: Publish to private Backblaze B2 bucket
        run: node distribution/b2/publish-release.mjs "${{ env.PUBLISH_DIR }}"
